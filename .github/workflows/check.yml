name: check

# One always-run aggregator job. No path filters, deliberately: on this
# substrate a skipped required check reports as success, so a filtered gate
# is worse than no gate (deployment/SPEC.md §4, B1's footgun clause).
on:
  push:
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every layer with a suite, because `npm run check` runs them all and a
      # missing install reads as a red gate rather than as a missing install.
      - run: npm ci --prefix engine
      - run: npm ci --prefix harness
      - run: npm run check
      # S2 and Q3 over the commits this push or PR actually lands. Both read the
      # commit that lands, and in CI nothing is staged, so without a range they
      # print SKIPPED and "CI is the second reader" was false for exactly these
      # two — and a fresh unhooked clone had neither (deployment/SPEC.md §7a
      # item 2). The pre-commit and commit-msg hooks still fire first; this is
      # the reader that --no-verify and a missing core.hooksPath cannot skip.
      - name: path class and swap diff over the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch reports an all-zero (or absent) base: fall back to the
          # tip commit alone rather than skipping, which is the failure mode
          # this step exists to end.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            SELECT="--range $BASE..$TIP"
          else
            SELECT="--commit $TIP"
          fi
          # A squash merge lands the whole PR as one commit on main, which S2
          # would refuse even though the PR's own commits were spec-first and
          # already passed this step on the pull_request run. When, and only
          # when, the push is a single commit whose tree is exactly BASE plus
          # PR N's net change, classify the PR's original commits instead.
          # Anything else keeps the range above, so a subject that merely ends
          # "(#N)" proves nothing. Git only, so S3 stays satisfied.
          PR=$(git log -1 --format=%s "$TIP" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$PR" ] \
             && [ "$(git rev-parse "$TIP^" 2>/dev/null)" = "$BASE" ] \
             && git fetch -q origin "refs/pull/$PR/head" 2>/dev/null; then
            PRHEAD=$(git rev-parse FETCH_HEAD)
            MB=$(git merge-base "$BASE" "$PRHEAD" 2>/dev/null || true)
            LANDED=$(git merge-tree --write-tree "$BASE" "$PRHEAD" 2>/dev/null || true)
            if [ -n "$MB" ] && [ -n "$LANDED" ] && [ "$LANDED" = "$(git rev-parse "$TIP^{tree}")" ]; then
              SELECT="--range $MB..$PRHEAD"
              echo "squash merge of #$PR: classifying its original commits"
            fi
          fi
          echo "classifying $SELECT"
          node deployment/scripts/s2-path-class.mjs $SELECT
          node deployment/scripts/q3-swap-diff.mjs $SELECT
